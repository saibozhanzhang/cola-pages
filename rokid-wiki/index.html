<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乐奇 AI 眼镜 · 体验顾问知识库</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --red:#FF383C;--orange:#FF8D28;--yellow:#FFCC00;--green:#34C759;
  --mint:#00C8B3;--teal:#00C3D0;--cyan:#00C0E8;--blue:#0088FF;
  --indigo:#6155F5;--purple:#CB30E0;--pink:#FF2D55;
  --gray:#8E8E93;--gray2:#AEAEB2;--gray3:#C7C7CC;--gray5:#E5E5EA;--gray6:#F2F2F7;
  --bg:#FFFFFF;--bg2:#F5F5F7;--bg-dark:#0a0a0c;
  --text:#1D1D1F;--text2:#6E6E73;--text3:rgba(0,0,0,0.56);
  --text-on-dark:#F5F5F7;
  --cta:#0071E3;--link-dark:#2997FF;
  --font:"SF Pro Text","SF Pro Icons","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(0.32,0.72,0,1);
  --dur:0.5s;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth}
body{
  background:var(--bg-dark);color:var(--text-on-dark);
  font-family:var(--font);font-weight:400;
  line-height:1.5;letter-spacing:-0.3px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
::-webkit-scrollbar{width:0;height:0}

/* ===== Dock (bottom navigation, macOS/iOS style) ===== */
.dock{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  z-index:200;display:flex;gap:6px;padding:8px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(40px) saturate(2);
  -webkit-backdrop-filter:blur(40px) saturate(2);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:24px;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
  max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;
}
.dock::-webkit-scrollbar{display:none}
.dock-item{
  width:44px;height:44px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.3s var(--ease);
  background:transparent;border:none;color:rgba(255,255,255,0.5);
  font-size:20px;flex-shrink:0;position:relative;
}
.dock-item:hover{background:rgba(255,255,255,0.1);color:#fff;transform:translateY(-4px) scale(1.1)}
.dock-item.active{background:var(--cta);color:#fff;transform:translateY(-2px) scale(1.05)}
.dock-item .label{
  position:absolute;bottom:-20px;font-size:9px;white-space:nowrap;
  opacity:0;transition:opacity 0.2s;
}
.dock-item:hover .label{opacity:1}

/* ===== Command Palette (⌘K) ===== */
.cmd-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:15vh;animation:fadeIn 0.2s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.cmd-box{
  width:90%;max-width:560px;background:rgba(30,30,32,0.95);
  backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;overflow:hidden;
  box-shadow:0 24px 80px rgba(0,0,0,0.5);
  animation:slideUp 0.3s var(--ease);
}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.cmd-input{
  width:100%;padding:18px 20px 18px 52px;
  font-size:17px;font-family:var(--font);
  background:transparent;border:none;color:var(--text-on-dark);
  outline:none;border-bottom:1px solid rgba(255,255,255,0.08);
}
.cmd-input::placeholder{color:rgba(255,255,255,0.3)}
.cmd-icon{position:absolute;left:20px;top:18px;font-size:18px;color:rgba(255,255,255,0.3)}
.cmd-list{max-height:400px;overflow-y:auto;padding:8px}
.cmd-item{
  padding:12px 16px;border-radius:12px;cursor:pointer;
  display:flex;align-items:center;gap:12px;
  color:rgba(255,255,255,0.7);font-size:14px;
  transition:background 0.15s;
}
.cmd-item:hover,.cmd-item.selected{background:rgba(255,255,255,0.08)}
.cmd-item .ci-icon{font-size:18px;width:24px;text-align:center}
.cmd-item .ci-title{flex:1}
.cmd-item .ci-cat{font-size:11px;color:rgba(255,255,255,0.3)}

/* ===== Full-screen Slide Panels ===== */
.slides-container{
  position:relative;width:100%;
}
.slide{
  min-height:100vh;width:100%;
  display:flex;align-items:center;justify-content:center;
  padding:60px 24px 100px;
  position:relative;overflow:hidden;
}
.slide-content{max-width:1100px;width:100%;position:relative;z-index:2}

/* ===== Hero Slide ===== */
.hero-slide{
  background:radial-gradient(ellipse at 50% 30%,rgba(0,113,227,0.15) 0%,transparent 60%),var(--bg-dark);
  min-height:100vh;
}
.hero-slide::before{
  content:'';position:absolute;inset:0;
  background:url('listenhub-20260704-112237-tjjolj.png') center/cover;
  opacity:0.3;mask-image:radial-gradient(ellipse at center,black 30%,transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 70%);
}
.hero-content{text-align:center;position:relative;z-index:2}
.hero-badge{
  display:inline-block;padding:6px 16px;border-radius:980px;
  background:rgba(0,113,227,0.15);border:1px solid rgba(0,113,227,0.3);
  font-size:13px;color:var(--link-dark);font-weight:600;margin-bottom:20px;
}
.hero-title{font-size:80px;font-weight:700;line-height:84px;letter-spacing:-2px;margin-bottom:12px}
.hero-title .grad{
  background:linear-gradient(135deg,var(--blue),var(--purple) 50%,var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-size:200% 200%;animation:shimmer 3s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero-sub{font-size:22px;color:rgba(255,255,255,0.6);max-width:600px;margin:0 auto 36px;line-height:30px}
.hero-orb{
  display:flex;gap:16px;justify-content:center;flex-wrap:wrap;
}
.orb{
  width:120px;height:120px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(20px);transition:all 0.4s var(--ease);
  cursor:default;
}
.orb:hover{background:rgba(255,255,255,0.1);transform:scale(1.08);border-color:rgba(255,255,255,0.2)}
.orb .orb-num{font-size:24px;font-weight:700;color:var(--link-dark)}
.orb .orb-lbl{font-size:11px;color:rgba(255,255,255,0.5);margin-top:2px}
.scroll-hint{
  position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,0.3);font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.scroll-hint .arrow{animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* ===== Section Slide ===== */
.section-slide{background:var(--bg-dark)}
.section-slide.alt{background:linear-gradient(180deg,#0a0a0c,#121216)}
.section-slide.light{background:var(--bg2);color:var(--text)}
.section-slide.light h2{color:var(--text)}
.section-slide.light p{color:var(--text2)}
.section-slide.light strong{color:var(--text)}

.slide-tag{
  display:inline-block;padding:4px 12px;border-radius:6px;
  font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;
  margin-bottom:12px;
}
.slide-tag.blue{background:rgba(0,136,255,0.15);color:var(--blue)}
.slide-tag.green{background:rgba(52,199,89,0.15);color:var(--green)}
.slide-tag.purple{background:rgba(97,85,245,0.15);color:var(--indigo)}
.slide-tag.orange{background:rgba(255,141,40,0.15);color:var(--orange)}
.slide-tag.pink{background:rgba(255,45,85,0.15);color:var(--pink)}

.slide-title{font-size:48px;font-weight:700;letter-spacing:-1px;margin-bottom:8px;line-height:52px}
.slide-subtitle{font-size:18px;color:rgba(255,255,255,0.5);margin-bottom:32px}
.section-slide.light .slide-subtitle{color:var(--text2)}

/* ===== Big Stat Cards (glassmorphism) ===== */
.stat-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.stat-card{
  flex:1;min-width:140px;padding:24px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;backdrop-filter:blur(20px);
  transition:all 0.4s var(--ease);
}
.stat-card:hover{background:rgba(255,255,255,0.08);transform:translateY(-4px);border-color:rgba(255,255,255,0.15)}
.stat-card .sc-val{font-size:40px;font-weight:700;color:var(--link-dark);letter-spacing:-1px}
.stat-card .sc-lbl{font-size:13px;color:rgba(255,255,255,0.5);margin-top:4px}
.section-slide.light .stat-card{background:var(--bg);border-color:var(--gray5)}
.section-slide.light .stat-card:hover{box-shadow:0 8px 24px rgba(0,0,0,0.06)}
.section-slide.light .stat-card .sc-lbl{color:var(--text2)}

/* ===== Spec Bars (dark) ===== */
.spec-bars{display:grid;gap:10px;margin:16px 0}
.spec-bar{display:flex;align-items:center;gap:12px}
.spec-bar .name{width:80px;font-size:13px;color:rgba(255,255,255,0.5);flex-shrink:0;font-weight:500}
.section-slide.light .spec-bar .name{color:var(--text2)}
.spec-bar .track{flex:1;height:24px;background:rgba(255,255,255,0.06);border-radius:980px;overflow:hidden}
.section-slide.light .spec-bar .track{background:var(--gray6)}
.spec-bar .fill{
  height:100%;border-radius:980px;
  display:flex;align-items:center;padding-left:10px;
  font-size:11px;font-weight:600;color:#fff;
  transition:width 1.5s var(--ease);width:0;
}
.fill.blue{background:linear-gradient(90deg,var(--cta),var(--blue))}
.fill.green{background:linear-gradient(90deg,var(--green),var(--mint))}
.fill.purple{background:linear-gradient(90deg,var(--indigo),var(--purple))}
.fill.orange{background:linear-gradient(90deg,var(--orange),var(--yellow))}
.fill.teal{background:linear-gradient(90deg,var(--teal),var(--cyan))}

/* ===== Glass Card ===== */
.glass-card{
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;padding:28px;backdrop-filter:blur(20px);
  transition:all 0.4s var(--ease);
}
.glass-card:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.12)}
.section-slide.light .glass-card{background:var(--bg);border-color:var(--gray5)}
.section-slide.light .glass-card:hover{box-shadow:0 8px 24px rgba(0,0,0,0.06)}
.glass-card h3{font-size:20px;font-weight:600;margin-bottom:10px;color:var(--text-on-dark)}
.section-slide.light .glass-card h3{color:var(--text)}
.glass-card p{font-size:14px;color:rgba(255,255,255,0.5);line-height:22px}
.section-slide.light .glass-card p{color:var(--text2)}

/* ===== Grid Layouts ===== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* ===== Tabs ===== */
.tabs{display:flex;gap:4px;margin:12px 0;background:rgba(255,255,255,0.06);border-radius:980px;padding:3px;width:fit-content;flex-wrap:wrap}
.section-slide.light .tabs{background:var(--gray6)}
.tab{padding:7px 14px;cursor:pointer;font-size:13px;color:rgba(255,255,255,0.5);border-radius:980px;transition:all 0.2s var(--ease);font-weight:500;white-space:nowrap;border:none;background:transparent;font-family:var(--font)}
.tab:hover{color:#fff}
.section-slide.light .tab:hover{color:var(--text)}
.tab.active{background:var(--cta);color:#fff;font-weight:600}
.tab-content{padding-top:12px;animation:fadeIn 0.3s var(--ease)}

/* ===== Table ===== */
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;border-radius:14px;overflow:hidden}
th{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.6);padding:8px 12px;text-align:left;font-weight:600;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.08)}
td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.7)}
.section-slide.light th{background:var(--bg2);color:var(--text);border-bottom:1px solid var(--gray5)}
.section-slide.light td{border-bottom:1px solid var(--gray5);color:var(--text2)}
tr:last-child td{border-bottom:none}
td:first-child{font-weight:600;color:#fff}
.section-slide.light td:first-child{color:var(--text)}

/* ===== Accordion ===== */
.acc-item{background:rgba(255,255,255,0.03);border-radius:14px;margin-bottom:6px;overflow:hidden;transition:all 0.2s}
.section-slide.light .acc-item{background:var(--bg)}
.acc-item:hover{background:rgba(255,255,255,0.06)}
.section-slide.light .acc-item:hover{background:var(--bg2)}
.acc-header{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;color:var(--text-on-dark);user-select:none}
.section-slide.light .acc-header{color:var(--text)}
.acc-header:hover{background:rgba(255,255,255,0.03)}
.acc-icon{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--cta),var(--indigo));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.acc-icon.warn{background:linear-gradient(135deg,var(--red),var(--orange))}
.acc-arrow{margin-left:auto;color:rgba(255,255,255,0.3);transition:transform 0.3s var(--ease);font-size:12px}
.acc-item.open .acc-arrow{transform:rotate(90deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height 0.4s var(--ease)}
.acc-item.open .acc-body{max-height:1000px}
.acc-body-inner{padding:2px 18px 14px 54px;color:rgba(255,255,255,0.5);font-size:14px;line-height:1.6}
.section-slide.light .acc-body-inner{color:var(--text2)}

/* ===== Highlight ===== */
.hl{border-radius:14px;padding:12px 16px;margin:10px 0;font-size:14px;line-height:1.6}
.hl.blue{background:rgba(0,113,227,0.1);border-left:3px solid var(--cta)}
.hl.orange{background:rgba(255,141,40,0.1);border-left:3px solid var(--orange)}
.hl.green{background:rgba(52,199,89,0.1);border-left:3px solid var(--green)}
.hl.red{background:rgba(255,56,60,0.1);border-left:3px solid var(--red)}

/* ===== Chart ===== */
.chart-box{background:rgba(255,255,255,0.03);border-radius:16px;padding:16px;margin:10px 0}
.section-slide.light .chart-box{background:var(--bg);border:1px solid var(--gray5)}

/* ===== Tag ===== */
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600}
.tag.official{background:rgba(52,199,89,0.15);color:var(--green)}
.tag.media{background:rgba(255,141,40,0.15);color:var(--orange)}

/* ===== Compare Bars ===== */
.compare-row{display:grid;grid-template-columns:100px 1fr auto;align-items:center;gap:10px;margin:6px 0;font-size:13px}
.compare-row .cname{color:rgba(255,255,255,0.5);text-align:right;font-weight:500}
.section-slide.light .compare-row .cname{color:var(--text2)}
.compare-row .ctrack{height:18px;background:rgba(255,255,255,0.06);border-radius:980px;overflow:hidden}
.section-slide.light .compare-row .ctrack{background:var(--gray6)}
.compare-row .cfill{height:100%;border-radius:980px;transition:width 1.5s var(--ease);width:0}
.compare-row .cval{font-weight:600;color:rgba(255,255,255,0.8);white-space:nowrap;font-size:11px}
.section-slide.light .compare-row .cval{color:var(--text)}

/* ===== Scene Cards ===== */
.scene-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:16px 0}
.scene-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;overflow:hidden;transition:all 0.4s var(--ease)}
.scene-card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,0.15)}
.scene-card img{width:100%;height:140px;object-fit:cover}
.scene-card .sc-body{padding:16px}
.scene-card .sc-title{font-weight:600;color:var(--text-on-dark);margin-bottom:4px;font-size:15px}
.scene-card .sc-desc{font-size:13px;color:rgba(255,255,255,0.4)}

/* ===== Persona ===== */
.persona-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0}
.persona-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:20px 12px;text-align:center;transition:all 0.3s var(--ease)}
.persona-card:hover{background:rgba(255,255,255,0.06);transform:translateY(-3px)}
.persona-card .emoji{font-size:28px;margin-bottom:6px}
.persona-card .role{font-weight:600;color:var(--text-on-dark);font-size:14px;margin-bottom:2px}
.persona-card .scene{font-size:11px;color:rgba(255,255,255,0.4)}

/* ===== Selling Points ===== */
.sp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:16px 0}
.sp-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:24px 20px;position:relative;overflow:hidden;transition:all 0.4s var(--ease)}
.sp-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cta),var(--purple));opacity:0;transition:opacity 0.3s}
.sp-card:hover{background:rgba(255,255,255,0.06);transform:translateY(-4px);border-color:rgba(255,255,255,0.12)}
.sp-card:hover::before{opacity:1}
.sp-card .sp-icon{font-size:28px;margin-bottom:8px}
.sp-card .sp-title{font-weight:600;color:var(--text-on-dark);font-size:15px;margin-bottom:4px}
.sp-card .sp-desc{font-size:13px;color:rgba(255,255,255,0.4);line-height:1.5}

/* ===== Search button (floating) ===== */
.search-fab{
  position:fixed;top:16px;right:16px;z-index:150;
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,0.1);backdrop-filter:blur(40px) saturate(2);
  border:1px solid rgba(255,255,255,0.15);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:rgba(255,255,255,0.6);font-size:18px;
  transition:all 0.3s var(--ease);
}
.search-fab:hover{background:rgba(255,255,255,0.15);color:#fff;transform:scale(1.1)}
.search-fab .kbd{
  position:absolute;top:-8px;right:-8px;
  font-size:9px;padding:2px 5px;border-radius:4px;
  background:var(--cta);color:#fff;font-weight:600;
}

/* ===== Animations ===== */
.fade-in{animation:fadeUp var(--dur) var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.stagger-1{animation-delay:0.05s}.stagger-2{animation-delay:0.1s}.stagger-3{animation-delay:0.15s}
.stagger-4{animation-delay:0.2s}.stagger-5{animation-delay:0.25s}.stagger-6{animation-delay:0.3s}
.stagger-7{animation-delay:0.35s}.stagger-8{animation-delay:0.4s}

.search-hidden{display:none!important}

/* ===== Mobile ===== */
/* ===== Mobile Bottom Tab Bar (replaces dock on mobile) ===== */
.mobile-tabbar{
  display:none;
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  background:rgba(20,20,22,0.85);
  backdrop-filter:blur(40px) saturate(2);
  -webkit-backdrop-filter:blur(40px) saturate(2);
  border-top:1px solid rgba(255,255,255,0.08);
}
.mobile-tabbar-items{display:flex;justify-content:space-around;align-items:center}
.mtb-item{
  flex:1;min-width:0;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border:none;background:transparent;
  cursor:pointer;color:rgba(255,255,255,0.35);
  font-size:9px;font-weight:500;font-family:var(--font);
  transition:color 0.2s;
}
.mtb-item.active{color:var(--link-dark)}
.mtb-item .mtb-icon{font-size:20px}
.mtb-more-sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:250;
  background:rgba(20,20,22,0.95);
  backdrop-filter:blur(40px) saturate(2);

function useIsMobile() {
  const [isMobile, setIsMobile] = useState(typeof window !== 'undefined' ? window.innerWidth <= 768 : false);
  useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth <= 768);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);
  return isMobile;
}

function useScrollSpy(ids) {
  const [activeId, setActiveId] = useState(ids[0]);
  useEffect(() => {
    const handler = () => {
      const y = window.scrollY + 100;
      let current = ids[0];
      for (const id of ids) {
        const el = document.getElementById(id);
        if (el && el.offsetTop <= y) current = id;
      }
      setActiveId(current);
    };
    window.addEventListener('scroll', handler, { passive: true });
    handler();
    return () => window.removeEventListener('scroll', handler);
  }, [ids.join(',')]);
  return activeId;
}

function CommandPalette({ open, onClose, onNavigate }) {
  const [query, setQuery] = useState('');
  const [selectedIdx, setSelectedIdx] = useState(0);
  const inputRef = useRef(null);

  useEffect(() => {
    if (open) {
      setQuery('');
      setSelectedIdx(0);
      setTimeout(() => inputRef.current?.focus(), 50);
    }
  }, [open]);

  useEffect(() => {
    if (!open) return;
    const handler = (e) => {
      if (e.key === 'Escape') onClose();
      if (e.key === 'ArrowDown') { e.preventDefault(); setSelectedIdx(i => Math.min(i+1, filtered.length-1)); }
      if (e.key === 'ArrowUp') { e.preventDefault(); setSelectedIdx(i => Math.max(i-1, 0)); }
      if (e.key === 'Enter' && filtered[selectedIdx]) { onNavigate(filtered[selectedIdx].id); onClose(); }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [open, query, selectedIdx]);

  const filtered = query
    ? CMD_ITEMS.filter(item => item.title.toLowerCase().includes(query.toLowerCase()))
    : CMD_ITEMS;

  if (!open) return null;
  return (
    <div className="cmd-overlay" onClick={onClose}>
      <div className="cmd-box" onClick={e => e.stopPropagation()}>
        <div style={{position:'relative'}}>
          <span className="cmd-icon">🔍</span>
          <input ref={inputRef} className="cmd-input" value={query} onChange={e => {setQuery(e.target.value);setSelectedIdx(0)}} placeholder="搜索功能、参数、话术..." />
        </div>
        <div className="cmd-list">
          {filtered.length === 0 && <div style={{padding:'20px',textAlign:'center',color:'rgba(255,255,255,0.3)',fontSize:'14px'}}>没有匹配结果</div>}
          {filtered.map((item, i) => (
            <div key={i} className={`cmd-item ${i === selectedIdx ? 'selected' : ''}`} onClick={() => { onNavigate(item.id); onClose(); }}>
              <span className="ci-icon">{item.icon}</span>
              <span className="ci-title">{item.title}</span>
              <span className="ci-cat">{item.cat}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Accordion({ items, iconType, search }) {
  const [openIdx, setOpenIdx] = useState(null);
  const filtered = search ? items.map((it,i) => ({...it,i})).filter(it => (it.q+it.a).toLowerCase().includes(search.toLowerCase())) : items.map((it,i) => ({...it,i}));
  useEffect(() => { if (search && filtered.length > 0) setOpenIdx(filtered[0].i); }, [search]);
  if (!filtered.length) return <p style={{color:'rgba(255,255,255,0.3)',padding:'16px'}}>没有匹配的问题</p>;
  return <div>{filtered.map(item => (
    <div key={item.i} className={`acc-item ${openIdx === item.i ? 'open' : ''}`}>
      <div className="acc-header" onClick={() => setOpenIdx(openIdx === item.i ? null : item.i)}>
        <span className={`acc-icon ${iconType === 'warn' ? 'warn' : ''}`}>{iconType === 'warn' ? '!' : 'Q'}</span>
        {item.q}<span className="acc-arrow">▶</span>
      </div>
      <div className="acc-body"><div className="acc-body-inner">{item.a}</div></div>
    </div>
  ))}</div>;
}

// ==================== App ====================
function App() {
  const [cmdOpen, setCmdOpen] = useState(false);
  const [search, setSearch] = useState('');
  const [animate, setAnimate] = useState(false);

  const allIds = useMemo(() => ['hero','specs','price','points','scenes','ai','pay','compare','faq','objection','users','service'], []);
  const activeId = useScrollSpy(allIds);

  useEffect(() => {
    const t = setTimeout(() => setAnimate(true), 500);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    const handler = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); setCmdOpen(true); }
      if (e.key === '/' && !cmdOpen) { e.preventDefault(); setCmdOpen(true); }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [cmdOpen]);

  const handleNav = useCallback((id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, []);

  const searchLower = search.toLowerCase().trim();
  useEffect(() => {
    if (!searchLower) {
      document.querySelectorAll('[data-search]').forEach(el => el.classList.remove('search-hidden'));
      return;
    }
    document.querySelectorAll('[data-search]').forEach(el => {
      if (el.textContent.toLowerCase().includes(searchLower)) el.classList.remove('search-hidden');
      else el.classList.add('search-hidden');
    });
  }, [searchLower]);

  return (
    <div>
      <button className="search-fab" onClick={() => setCmdOpen(true)}>
        🔍<span className="kbd">⌘K</span>
      </button>
      <div className="mobile-search">
        <button className="mobile-search-btn" onClick={() => setCmdOpen(true)}>
          🔍 搜索功能、参数、话术...
        </button>
      </div>
      <CommandPalette open={cmdOpen} onClose={() => setCmdOpen(false)} onNavigate={handleNav} />
      <Dock activeId={activeId} onNav={handleNav} />

      <HeroSlide />
      <SpecsSlide animate={animate} />
      <PriceSlide />
      <PointsSlide />
      <ScenesSlide />
      <AISlide />
      <PaySlide />
      <CompareSlide animate={animate} />
      <FAQSlide search={searchLower} />
      <ObjectionSlide search={searchLower} />
      <UsersSlide />
      <ServiceSlide />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
